<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img">
  <title>Placeholder cover — replace with your own illustration</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1d27"/>
      <stop offset="1" stop-color="#14151c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c6cff"/>
      <stop offset="1" stop-color="#ff7ab6"/>
    </linearGradient>
  </defs>
  <rect width="760" height="300" rx="4" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="759" height="299" rx="4" fill="none" stroke="#2a2e3a"/>
  <circle cx="640" cy="60" r="120" fill="#7c6cff" opacity=".10"/>
  <circle cx="120" cy="290" r="140" fill="#ff7ab6" opacity=".07"/>
  <g transform="translate(70 70)">
    <rect width="300" height="160" rx="3" fill="#20232e" stroke="#343846"/>
    <circle cx="22" cy="20" r="5" fill="#ff8a8a"/><circle cx="40" cy="20" r="5" fill="#f2b866"/><circle cx="58" cy="20" r="5" fill="#5fd39a"/>
    <rect x="22" y="50" width="120" height="10" rx="2" fill="url(#accent)"/>
    <rect x="22" y="74" width="210" height="10" rx="2" fill="#3a3f4f"/>
    <rect x="22" y="98" width="170" height="10" rx="2" fill="#3a3f4f"/>
    <rect x="22" y="122" width="90" height="10" rx="2" fill="#5fd39a" opacity=".8"/>
  </g>
  <g transform="translate(420 92)" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="0" y="40" fill="#e8e9ef" font-size="34" font-weight="700">Your course</text>
    <text x="0" y="78" fill="#9aa0ae" font-size="18">Replace assets/cover.svg</text>
    <rect x="0" y="100" width="150" height="8" rx="2" fill="url(#accent)"/>
  </g>
</svg>
